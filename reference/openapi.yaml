  /api/v2/transfers/{transfer_uuid}/card-binding/reissue:
    post:
      summary: Reissue an off-ramp card-binding link.
      operationId: reissueAnOffRampCardBindingLink
      description: >-
        The link the recipient uses to complete an off-ramp VDC card binding can
        go

        stale before they ever open it (its underlying CRB signup session has
        its own,

        bank-controlled lifetime independent of anything Harbor's wrapper link
        does).

        Call this to invalidate the old link and get a fresh one — the merchant
        is

        responsible for re-sending it to the recipient. Rate-limited to one
        reissue per

        transfer per 5 minutes.
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '200':
          description: reissued
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    card_binding_url: https://card-binding.example.com/bind/card_abc123
                properties:
                  data:
                    type: object
                    properties:
                      card_binding_url:
                        type: string
                        example: https://card-binding.example.com/bind/card_abc123
                        description: >-
                          The new card-binding link. The previous one stops
                          working immediately.
        '404':
          description: transfer not found
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Transfer not found
                  error: Transfer not found
                  code: 2001
                  error_type: general.resource_not_found
                properties:
                  message:
                    type: string
                    example: Transfer not found
                  error:
                    type: string
                    example: Transfer not found
                  code:
                    type: integer
                    example: 2001
                  error_type:
                    type: string
                    example: general.resource_not_found
        '422':
          description: reissue failed
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Failed to reissue card-binding link
                properties:
                  message:
                    type: string
                    example: Failed to reissue card-binding link
      tags:
        - Transfer (v2)
    parameters:
      - in: path
        name: transfer_uuid
        description: The ID of the transfer.
        example: transfer_1234567890
        required: true
        schema:
          type: string
