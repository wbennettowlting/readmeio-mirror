  /api/v2/customers/individual/occupations:
    get:
      summary: List occupations
      operationId: listOccupations
      description: >-
        Returns the occupations an individual customer may use for the
        `occupation` field of

        customer onboarding. Each `value` is a human-readable slug you submit;
        `label` is a

        description. The list is global (not country-specific). Returns an empty
        list if the

        occupation reference data has not been synced yet.
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  - description: synced
                    type: object
                    example:
                      data:
                        - value: software_engineer
                          label: Software Engineer
                        - value: teacher
                          label: Teacher
                    properties:
                      data:
                        type: array
                        example:
                          - value: software_engineer
                            label: Software Engineer
                          - value: teacher
                            label: Teacher
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                              example: software_engineer
                            label:
                              type: string
                              example: Software Engineer
                  - description: not yet synced
                    type: object
                    example:
                      data: []
                    properties:
                      data:
                        type: array
                        example: []
      tags:
        - Individual Graded KYC (v2)
  /api/v2/customers/individual/countries/{country}/subdivisions:
    get:
      summary: List subdivisions where individual verification is available
      operationId: listSubdivisionsWhereIndividualVerificationIsAvailable
      description: >-
        Returns the subdivisions of a country in which a graded individual
        customer may be

        verified. This is NARROWER than the ISO list from the subdivisions
        endpoint on two

        counts: a subdivision can exist and still carry no licence, and a
        subdivision Harbor

        blocks for compliance is excluded even when it is licensed. Onboarding
        rejects

        `residence.state` values outside this list. Query this one for an
        individual

        customer, not the ISO list. Returns an empty list when the reference
        data has not

        been synced yet.
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    - code: FL
                      name: Florida
                      type: State
                    - code: WA
                      name: Washington
                      type: State
                properties:
                  data:
                    type: array
                    example:
                      - code: FL
                        name: Florida
                        type: State
                      - code: WA
                        name: Washington
                        type: State
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: FL
                        name:
                          type: string
                          example: Florida
                        type:
                          type: string
                          example: State
      tags:
        - Individual Graded KYC (v2)
    parameters:
      - in: path
        name: country
        description: ISO 3166-1 alpha-2 country code. Case-insensitive.
        example: US
        required: true
        schema:
          type: string
  /api/v2/customers/individual/countries/{country}/identity_documents:
    get:
      summary: List accepted identity documents for individual verification
      operationId: listAcceptedIdentityDocumentsForIndividualVerification
      description: >-
        Returns the identity document types a graded individual customer may
        submit for a

        given country, and which images each type needs. Onboarding rejects an

        `identity_document.type` that is not in this list, and requires

        `identity_document.back` when the type needs a BACK image, so read this
        before

        collecting the document. Returns an empty list when the reference data
        has not been

        synced yet, or for a country we hold no document data for.
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    - type: NATIONAL_ID
                      required_parts:
                        - FRONT
                        - BACK
                      back_required: true
                    - type: PASSPORT
                      required_parts:
                        - FRONT
                      back_required: false
                properties:
                  data:
                    type: array
                    example:
                      - type: NATIONAL_ID
                        required_parts:
                          - FRONT
                          - BACK
                        back_required: true
                      - type: PASSPORT
                        required_parts:
                          - FRONT
                        back_required: false
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: NATIONAL_ID
                        required_parts:
                          type: array
                          example:
                            - FRONT
                            - BACK
                          items:
                            type: string
                        back_required:
                          type: boolean
                          example: true
      tags:
        - Individual Graded KYC (v2)
    parameters:
      - in: path
        name: country
        description: ISO 3166-1 alpha-2 country code. Case-insensitive.
        example: TW
        required: true
        schema:
          type: string
  /api/v2/customers/{customer_uuid}/individual/onboarding:
    post:
      summary: Start graded verification
      operationId: startGradedVerification
      description: >-
        Submits the complete KYC data for the requested level (1 or 2) and
        processes it

        asynchronously; the response is the customer's verification standing,
        the same shape

        every endpoint in this group answers. Level 1 is only available when the
        residence

        country is the US. Level 3 cannot be applied for directly: complete
        level 2, then

        apply through the upgrade endpoint. Track progress via the GET endpoint
        or

        `customer.*` webhooks.
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '202':
          description: accepted for processing
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    status: processing
                    kyc_level: null
                    next_level: null
                    transfers_blocked: true
                    rfi_link: null
                    pending_requirements: []
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: processing
                        description: >-
                          Where the verification stands. Possible values:
                          `processing`, `action_required`, `submitted`,
                          `verified`, `declined`, `failed`. `action_required`
                          covers everything to fix and resend, including a
                          correctable rejection; `declined` is final — no
                          resubmission.
                      kyc_level:
                        type: string
                        example: null
                        description: >-
                          The APPROVED verification level (1-3). Null until the
                          reviewer approves one; it answers what the customer
                          can do today, not what was applied for.
                      next_level:
                        type: string
                        example: null
                        description: >-
                          The level the upgrade endpoint would accept right now.
                          Null while a review is in flight or an
                          advanced-verification application is on file.
                      transfers_blocked:
                        type: boolean
                        example: true
                        description: >-
                          Whether transfers are currently refused for this
                          customer.
                      rfi_link:
                        type: string
                        example: null
                        description: >-
                          Link to the additional-information page. Null unless
                          information has been requested.
                      pending_requirements:
                        type: array
                        example: []
                        description: >-
                          Outstanding verification requirements. Filled only
                          when status is `action_required`.
        '409':
          description: a submission is already awaiting review
          content:
            application/json:
              schema:
                type: object
                example:
                  message: >-
                    This customer's verification has been submitted and is
                    awaiting review. Wait for the result instead of submitting
                    again.
                  error: >-
                    This customer's verification has been submitted and is
                    awaiting review. Wait for the result instead of submitting
                    again.
                  code: 2302
                  error_type: onboarding.already_active
                  details:
                    onboarding_uuid: onb_c9A8SHsBdcka62b60WUhvt5TNFK1vfrf
                    onboarding_status: submitted
                    submitted_at: '2026-09-09T07:40:00+00:00'
                properties:
                  message:
                    type: string
                    example: >-
                      This customer's verification has been submitted and is
                      awaiting review. Wait for the result instead of submitting
                      again.
                  error:
                    type: string
                    example: >-
                      This customer's verification has been submitted and is
                      awaiting review. Wait for the result instead of submitting
                      again.
                  code:
                    type: integer
                    example: 2302
                  error_type:
                    type: string
                    example: onboarding.already_active
                  details:
                    type: object
                    properties:
                      onboarding_uuid:
                        type: string
                        example: onb_c9A8SHsBdcka62b60WUhvt5TNFK1vfrf
                      onboarding_status:
                        type: string
                        example: submitted
                      submitted_at:
                        type: string
                        example: '2026-09-09T07:40:00+00:00'
      tags:
        - Individual Graded KYC (v2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kyc_level:
                  type: integer
                  description: >-
                    Verification level to apply for. Possible values: `1`, `2`.
                    Which of the fields below are required follows from this
                    number: level 1 collects a residence state only (US
                    residents); level 2 collects the full KYC set.
                  example: 1
                  enum:
                    - 1
                    - 2
                nationality:
                  type: string
                  description: >-
                    ISO 3166-1 alpha-2 nationality. Required at every level.
                    Must be 2 characters.
                  example: US
                  nullable: true
                residence:
                  type: object
                  description: Residence address.
                  example: null
                  properties:
                    country:
                      type: string
                      description: >-
                        ISO 3166-1 alpha-2 country code. Required at every
                        level. Level 1 exists only in the United States. Must be
                        2 characters.
                      example: US
                      nullable: true
                    state:
                      type: string
                      description: >-
                        State / province. Required for a residence in the United
                        States. Must not be greater than 32 characters.
                      example: DE
                      nullable: true
                    street:
                      type: string
                      description: >-
                        (kyc_level 2) Street line. Must not be greater than 200
                        characters.
                      example: 100 Market Street
                      nullable: true
                    sub_street:
                      type: string
                      description: >-
                        (kyc_level 2) Additional address line. Must not be
                        greater than 200 characters.
                      example: Suite 200
                      nullable: true
                    city:
                      type: string
                      description: >-
                        (kyc_level 2) City. Must not be greater than 100
                        characters.
                      example: Wilmington
                      nullable: true
                    postal_code:
                      type: string
                      description: >-
                        (kyc_level 2) Postal / ZIP code. Must not be greater
                        than 32 characters.
                      example: '19801'
                      nullable: true
                  nullable: true
                ssn:
                  type: string
                  description: >-
                    (kyc_level 2) Social Security Number, 9 digits. Required for
                    a residence in the United States; not accepted otherwise
                    (send tax_id). Must match the regex /^[0-9]{9}$/.
                  example: '123456789'
                  nullable: true
                tax_id:
                  type: string
                  description: >-
                    (kyc_level 2) Local tax identification number (TIN).
                    Required for a residence outside the United States; not
                    accepted otherwise (send ssn). Must not be greater than 64
                    characters.
                  example: TAX123456
                  nullable: true
                occupation:
                  type: string
                  description: >-
                    (kyc_level 2) Occupation slug. Fetch the list from GET
                    /api/v2/customers/individual/occupations. Must not be
                    greater than 64 characters.
                  example: software_engineer
                  nullable: true
                purpose_of_use:
                  type: array
                  description: A purpose of use value.
                  example:
                    - savingsHolding
                  items:
                    type: string
                    enum:
                      - investmentTrading
                      - savingsHolding
                      - payments
                      - salaryFunds
                      - businessPayments
                      - remittancesSupport
                      - other
                purpose_of_use_other:
                  type: string
                  description: >-
                    (required if purpose_of_use includes `other`) Free-text
                    description of the purpose of use. Must not be greater than
                    255 characters.
                  example: null
                  nullable: true
                phone_country_code:
                  type: string
                  description: >-
                    ISO 3166-1 alpha-2 country code of the phone number.
                    Required for a residence in the United States when the
                    customer record has no phone number. Must be 2 characters.
                  example: US
                  nullable: true
                phone_number:
                  type: string
                  description: >-
                    Phone number. Required for a residence in the United States
                    when the customer record has no phone number. Must not be
                    greater than 20 characters.
                  example: '5551234567'
                  nullable: true
                identity_document:
                  type: object
                  description: (kyc_level 2) Identity document.
                  example: null
                  properties:
                    type:
                      type: string
                      description: >-
                        Document type. Possible values: `NATIONAL_ID`,
                        `PASSPORT`, `DRIVER_LICENCE`, `RESIDENCE_PERMIT`.
                      example: PASSPORT
                      enum:
                        - NATIONAL_ID
                        - PASSPORT
                        - DRIVER_LICENCE
                        - RESIDENCE_PERMIT
                      nullable: true
                    country:
                      type: string
                      description: >-
                        ISO 3166-1 alpha-2 issuing country of the document. Must
                        be 2 characters.
                      example: US
                      nullable: true
                    front:
                      type: string
                      description: Base64-encoded front image of the document.
                      example: ut
                      nullable: true
                    back:
                      type: string
                      description: >-
                        (required for document types that carry a back page)
                        Base64-encoded back image of the document.
                      example: sed
                      nullable: true
                  nullable: true
              required:
                - kyc_level
    patch:
      summary: Correct and resend the verification
      operationId: correctAndResendTheVerification
      description: >-
        Replaces the previous submission wholly (AML's own update is a full
