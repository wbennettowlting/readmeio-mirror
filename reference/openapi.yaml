      operationId: listIndustryClassifications
      description: >-
        Returns the industry (SIC) options a company customer may use for a
        given country,

        for the `company.industry` field of customer onboarding. Each `value` is
        the slug

        you submit; `label` is a human-readable description. The set is
        country-specific —

        the same value can mean different things in different countries — so
        always query

        by the company's country of incorporation. Returns an empty list for a
        country we

        do not have industry data for.
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    - value: fishing
                      label: Fishing
                    - value: forestry
                      label: Forestry
                    - value: gas_supply
                      label: Gas Supply
                properties:
                  data:
                    type: array
                    example:
                      - value: fishing
                        label: Fishing
                      - value: forestry
                        label: Forestry
                      - value: gas_supply
                        label: Gas Supply
                    items:
                      type: object
                      properties:
                        value:
                          type: string
                          example: fishing
                        label:
                          type: string
                          example: Fishing
