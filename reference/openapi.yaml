  /api/v1/countries/{country}/identity_documents:
    get:
      summary: List accepted identity documents for a country
      operationId: listAcceptedIdentityDocumentsForACountry
      description: >-
        Returns the identity document types the onboarding API accepts for a
        given issuing

        country, and which images each type needs. The compliance provider
        rejects an

        `associated_persons[].identity_files[]` part that is not in
        `required_parts` for the

        type and country (e.g. Malaysian `NATIONAL_ID` takes `FRONT` only), so
        read this

        before collecting the documents. Returns an empty list when the
        reference data has

        not been synced yet, or for a country we hold no document data for.
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    - type: NATIONAL_ID
                      required_parts:
                        - FRONT
                      back_required: false
                    - type: PASSPORT
                      required_parts:
                        - FRONT
                      back_required: false
                properties:
                  data:
                    type: array
                    example:
                      - type: NATIONAL_ID
                        required_parts:
                          - FRONT
                        back_required: false
                      - type: PASSPORT
                        required_parts:
                          - FRONT
                        back_required: false
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: NATIONAL_ID
                        required_parts:
                          type: array
                          example:
                            - FRONT
                          items:
                            type: string
                        back_required:
                          type: boolean
                          example: false
      tags:
        - Countries
    parameters:
      - in: path
        name: country
        description: ISO 3166-1 alpha-2 country code. Case-insensitive.
        example: MY
        required: true
        schema:
          type: string
