                            rail_payment_id:
                              type: string
                              example: rail_abc123
                            imad:
                              type: string
                              example: 20260909MMQFMPU8000123
                            omad:
                              type: string
                              example: null
                              nullable: true
                            ach_trace_number:
                              type: string
                              example: null
                              nullable: true
                            created_at:
                              type: string
                              example: '2026-09-09T07:40:00+00:00'
                  - description: crypto payment
                    type: object
