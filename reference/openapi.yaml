                  error_type: general.resource_not_found
                properties:
                  message:
                    type: string
                    example: Transfer not found
                  error:
                    type: string
                    example: Transfer not found
                  code:
                    type: integer
                    example: 2001
                  error_type:
                    type: string
                    example: general.resource_not_found
      tags:
        - Endpoints
    parameters:
      - in: path
        name: transfer_uuid
        description: The ID of the transfer.
        example: transfer_1234567890
        required: true
        schema:
          type: string
