                    created_at: '2025-08-28T08:37:21.000000Z'
                    updated_at: '2025-08-28T08:37:21.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: sub_951ca83b-1330-4b7b-921a-a1c02f1345b5
                        description: The unique identifier of the webhook subscription.
                      name:
                        type: string
                        example: Transactions Webhook
                        description: The name of the webhook subscription.
                      endpoint:
                        type: string
                        example: https://example.com/webhook
                        description: >-
                          The URL endpoint where webhook events will be
                          delivered.
                      enabled:
                        type: boolean
                        example: true
                        description: Whether the webhook subscription is active.
                      notification_types:
                        type: array
                        example:
                          - '*'
                        description: >-
                          The list of event types to subscribe to. Use ["*"] for
                          all events.
                        items:
                          type: string
                      restricted:
                        type: boolean
                        example: false
                        description: >-
                          Administrative flag. When true, no webhooks are
                          delivered to this subscription regardless of its
                          notification types. Only OwlPay operations can change
                          it.
                      created_at:
                        type: string
                        example: '2025-08-28T08:37:21.000000Z'
                        description: >-
                          ISO 8601 timestamp of when the subscription was
                          created.
                      updated_at:
                        type: string
                        example: '2025-08-28T08:37:21.000000Z'
                        description: >-
                          ISO 8601 timestamp of when the subscription was last
                          updated.
      tags:
        - Webhook subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                  description: >-
                    URL of the endpoint to subscribe to notifications. Must be
                    publicly accessible, use HTTPS, and respond with a 2XX
                    status to a POST request. Must be a valid URL.
                  example: https://example.com/webhook
                notification_types:
                  type: array
                  description: >-
                    The event types to subscribe to. Omit this field to receive
                    everything — it defaults to ["*"]. Passing ["*"], on its own
                    or alongside specific types, has the same effect. Otherwise
                    only events matching the values you pass are delivered.
                    Matching is a wildcard pattern match, so a category wildcard
                    such as "transfer.*" subscribes you to every event in that
                    category. Each value must be one of the available
                    notification types. This list cannot be changed after the
                    subscription is created — create a new subscription instead.
                  example:
                    - transfer.sub_status.cpn_rfi
                  items:
                    type: string
                    enum:
                      - '*'
                      - transfer.*
                      - customer.*
                      - transfer.status.completed
                      - transfer.status.expired
                      - transfer.status.on_hold
                      - transfer.status.pending_harbor
                      - transfer.status.rejected
                      - transfer.status.refunded
                      - transfer.deposit.created
                      - transfer.sub_status.*
                      - transfer.sub_status.awaiting_settlement
                      - transfer.sub_status.cpn_rfi
                      - transfer.sub_status.cpn_rfi_submitted
                      - customer.kyc.declined
                      - customer.kyc.rejected
                      - customer.kyc.revoked
                      - customer.kyc.verified
                      - customer.kyc.verifying
                      - customer.agreement.accepted
                      - customer.kyc_level.changed
                      - customer.rfi.raised
                      - customer.rfi.resolved
                      - customer_onboarding.*
                      - customer_onboarding.action_required
                      - customer_onboarding.submitted
                      - customer_onboarding.verified
                      - customer_onboarding.declined
                      - customer_onboarding.failed
                      - wallet.*
                      - wallet.balance.updated
                      - deposit_account.*
                      - deposit_account.activated
                      - deposit_account.failed
                      - deposit_account.disabled
                      - bank_account.*
                      - bank_account.micro_deposit.received
                    nullable: true
              required:
                - endpoint
