  /api/v1/applications/faucet/usdc:
    post:
      summary: Claim testnet USDC (legacy)
      operationId: claimTestnetUSDClegacy
      description: >-
        Request USDC from the Circle Sandbox faucet to a specified blockchain
        address.

        The amount is deducted from the daily quota (500 USDC per chain per day
        per application).

        Superseded by `POST /faucet`, which also supports USDT — kept for
        existing callers.
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '200':
          description: Successful claim
          content:
            application/json:
              schema:
                type: object
                example:
                  chain: ethereum
                  address: '0x1234567890abcdef1234567890abcdef12345678'
                  amount: '100.00'
                  daily_used: '100.00'
                  daily_remaining: '400.00'
                  daily_limit: '500.00'
                  circle_payout_id: b8627ae8-732b-4d25-b947-1df8f4007a29
                properties:
                  chain:
                    type: string
                    example: ethereum
                    description: The blockchain chain name.
                  address:
                    type: string
                    example: '0x1234567890abcdef1234567890abcdef12345678'
                    description: The recipient wallet address.
                  amount:
                    type: string
                    example: '100.00'
                    description: The amount of USDC claimed.
                  daily_used:
                    type: string
                    example: '100.00'
                    description: Total USDC claimed today on this chain.
                  daily_remaining:
                    type: string
                    example: '400.00'
                    description: Remaining USDC quota for today on this chain.
                  daily_limit:
                    type: string
                    example: '500.00'
                    description: The daily limit per chain (always 500.00).
                  circle_payout_id:
                    type: string
                    example: b8627ae8-732b-4d25-b947-1df8f4007a29
                    description: The Circle payout transaction ID.
        '422':
          description: Daily limit exceeded
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'Daily limit exceeded. Remaining: 50.00 USDC'
                  error_code: 7001
                  daily_limit: '500.00'
                  daily_used: '450.00'
                  daily_remaining: '50.00'
                properties:
                  error:
                    type: string
                    example: 'Daily limit exceeded. Remaining: 50.00 USDC'
                  error_code:
                    type: integer
                    example: 7001
                  daily_limit:
                    type: string
