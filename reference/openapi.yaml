                          type: crypto
                          payment_method: ON_CHAIN
                          payment_method_label: On-chain Transfer
                          asset: USDC
                          amount: '1000.00'
                          sender_address: '0x1234567890abcdef1234567890abcdef12345678'
                          tx_hash: '0xabc123def456'
                          created_at: '2026-09-09T07:40:00+00:00'
                    properties:
                      data:
                        type: array
