                            key:
                              type: string
                              example: '1'
                            label:
                              type: string
                              example: What is the purpose of this account?
                            type:
                              type: string
                              example: short_answer
                            required:
                              type: boolean
                              example: true
                            options:
                              type: string
                              example: null
                              nullable: true
                            limit:
                              type: object
                              properties:
                                required:
                                  type: boolean
                                  example: true
                      answers:
                        type: object
                        properties:
                          '1':
                            type: string
                            example: Personal savings
                        description: The answers just submitted, keyed by question `key`.
        '404':
          description: no open RFI
