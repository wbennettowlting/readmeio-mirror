                    type: string
                    example: general.validation_error
                  errors:
                    type: object
                    properties:
                      country:
                        type: array
                        example:
                          - The country must be a valid ISO 3166-1 alpha-2 code.
                        items:
                          type: string
      tags:
        - Countries
    parameters:
      - in: path
        name: country
        description: ISO 3166-1 alpha-2 country code. Case-insensitive.
        example: TW
        required: true
        schema:
