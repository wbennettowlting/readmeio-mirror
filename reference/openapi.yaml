                        - FAMILY_MAINTENANCE
                        - EDUCATION
                        - MEDICAL_TREATMENT
                        - HOTEL
                        - TRAVEL
                        - REPAYMENT_OF_LOANS
                        - TAX_PAYMENT
                        - PURCHASE_PROPERTY
                        - PROPERTY_RENTAL
                        - INSURANCE_PREMIUM
                        - PRODUCT_INDEMNITY_INSURANCE
                        - INSURANCE_CLAIMS
                        - MUTUAL_FUND_INVESTMENT
                        - INVESTMENT_SHARES
                        - DONATIONS
                        - SALARY
                        - INFO_SERVICE
                        - ADVERTISING
                        - ROYALTY_FEES
                        - BROKER_FEES
                        - ADVISOR_FEES
                        - REPRESENTATIVE_EXPENSES
                        - CONSTRUCTION
                        - TRANSPORTATION
                        - EXPORTED_GOODS
                        - DELIVERY_FEES
                        - GENERAL_GOODS_OFFLINE
                    is_self_transfer:
                      type: boolean
                      description: Whether the transfer is a self-transfer.
                      example: false
                  required:
                    - beneficiary_info
                    - payout_instrument
                    - transfer_purpose
                    - is_self_transfer
