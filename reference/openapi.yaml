    patch:
      summary: Update a deposit account
      operationId: updateADepositAccount
      description: >-
        Retargets the destination and/or disables the account. At least one of
        `destination` or `status` must be

        provided. When both are sent with `status` `disabled`, the destination
        is retargeted first and then disabled.

        Destination retargeting is only allowed while the account is `active`.


        <aside class="warning"><strong>Disabling is permanent and
        irreversible.</strong> Setting `status` to

        `disabled` closes the account and deletes the underlying bank account at
        the banking provider. There is

        <strong>no API path to re-enable a disabled account</strong> — it cannot
        be reactivated and cannot be

        retargeted (a retarget on a disabled account returns 422). The same
        applies if OwlPay operations disables

        it on your behalf: the account stays closed. To receive deposits again
        you must create a brand-new deposit

        account via POST.</aside>


        Body parameters (with enum dropdowns) come from
        UpdateCustomerDepositAccountRequest::rules() and bodyParameters().
