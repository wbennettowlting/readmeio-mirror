      operationId: applyForAHigherLevel
      description: >-
        One entry point for every elevation. From level 1 the upgrade resubmits
        through the

        same verification flow; from level 2 it files an advanced-verification
        application

        that compliance reviews case by case -- the customer keeps transacting
        at the

        approved level while the application is open. A second application
        inside the

        cooldown window is refused.
