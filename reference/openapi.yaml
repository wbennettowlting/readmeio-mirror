                  description: Must be at least 1.
                  example: 7
                  nullable: true
    post:
      summary: Create a deposit account
      operationId: createADepositAccount
      description: >-
        Creates a deposit account for the given customer. A dedicated fiat bank
        account is provisioned

        asynchronously, so this returns HTTP **202** with `status`
        `provisioning` and `deposit_instructions` set to

        **`null`**. Once provisioning completes the account flips to `active`
        and the bank account the payer should

        wire / ACH into is populated in `deposit_instructions`. Receive it by
        subscribing to the `deposit_account`

        webhook (fired on activation, payload includes `deposit_instructions`)
        or by polling GET on the account.


        The deposit account receives fiat for a single source country
        (`source_country`, currently `US` only) and

        auto-converts it to crypto sent to `destination`. Travel Rule fields are
        supplied flat under `destination`

        (aligned with the Transfer v2 on-ramp convention) and are reused when
        the matching on-ramp transfer is created.


        Body parameters (with enum dropdowns) come from
        StoreCustomerDepositAccountRequest::rules() and

        bodyParameters(), so OpenAPI consumers such as readme.io render the
        fixed-choice fields as dropdowns.
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: depacc_1234567890
                    object: customer_deposit_account
                    customer_id: cus_1234567890
                    source_country: US
                    status: provisioning
                    destination:
                      type: external_address
                      asset: USDC
                      chain: ethereum
                      address: '0x1234567890abcdef1234567890abcdef12345678'
                      memo: null
                      beneficiary_info:
                        beneficiary_name: John Doe
                        beneficiary_dob: '1990-01-01'
                        beneficiary_id_doc_number: '12345678'
                        beneficiary_address:
                          street: 123 4th Ave S
                          city: Minneapolis
                          state_province: MN
                          postal_code: '55416'
                          country: US
                      transfer_purpose: SALARY
                      is_self_transfer: true
                      beneficiary_receiving_wallet_type: non_custodial
                      beneficiary_institution_name: Acme Inc.
                    deposit_instructions: null
                    commission:
                      percentage: 0.5
                      amount: 25
                    application_reference_id: ref-0001
                    created_at: '2026-06-10T00:00:00+00:00'
                    updated_at: '2026-06-10T00:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: depacc_1234567890
                        description: The unique identifier of the deposit account.
                      object:
                        type: string
                        example: customer_deposit_account
                        description: Object type, always `customer_deposit_account`.
                      customer_id:
                        type: string
                        example: cus_1234567890
                        description: The UUID of the owning customer.
                      source_country:
                        type: string
                        example: US
                        description: >-
                          ISO 3166-1 alpha-2 country whose fiat this account
                          receives.
                      status:
                        type: string
                        example: provisioning
                        description: >-
                          Account status. One of `provisioning`, `active`,
                          `disabled`, `failed`.
                      destination:
                        type: object
                        properties:
                          type:
                            type: string
                            example: external_address
                          asset:
                            type: string
                            example: USDC
                          chain:
                            type: string
                            example: ethereum
                          address:
                            type: string
                            example: '0x1234567890abcdef1234567890abcdef12345678'
                          memo:
                            type: string
                            example: null
                            nullable: true
                          beneficiary_info:
                            type: object
                            properties:
                              beneficiary_name:
                                type: string
                                example: John Doe
                              beneficiary_dob:
                                type: string
                                example: '1990-01-01'
                              beneficiary_id_doc_number:
                                type: string
                                example: '12345678'
                              beneficiary_address:
                                type: object
                                properties:
                                  street:
                                    type: string
                                    example: 123 4th Ave S
                                  city:
                                    type: string
                                    example: Minneapolis
                                  state_province:
                                    type: string
                                    example: MN
                                  postal_code:
                                    type: string
                                    example: '55416'
                                  country:
                                    type: string
                                    example: US
                          transfer_purpose:
                            type: string
                            example: SALARY
                          is_self_transfer:
                            type: boolean
                            example: true
                          beneficiary_receiving_wallet_type:
                            type: string
                            example: non_custodial
                          beneficiary_institution_name:
                            type: string
                            example: Acme Inc.
                        description: >-
                          The crypto destination plus Travel Rule fields
                          (`type`, `asset`, `chain`, `address`,
                          `memo`/`wallet_uuid`, `beneficiary_info`,
                          `transfer_purpose`, `is_self_transfer`,
                          `beneficiary_receiving_wallet_type`,
                          `beneficiary_institution_name`).
                      deposit_instructions:
                        type: string
                        example: null
                        description: >-
                          The bank account the payer wires / ACHes fiat into —
                          `account_number`, `routing_number`, `bank_name`,
                          `bank_address`, `account_holder_name`. **`null` until
                          `status` is `active`** — on creation the account is
                          still `provisioning`, so it is `null` here; it
                          populates once provisioning completes and is delivered
                          via the `deposit_account` webhook (on activation) or
                          any subsequent GET.
                      commission:
                        type: object
                        properties:
                          percentage:
                            type: number
                            example: 0.5
                          amount:
                            type: integer
                            example: 25
                        description: >-
                          Commission snapshot taken at creation. Contains
                          `percentage` (basis as a percentage) and `amount`
                          (fixed fee in USD).
                      application_reference_id:
                        type: string
                        example: ref-0001
                        description: Your own reference identifier, or `null`.
                      created_at:
                        type: string
                        example: '2026-06-10T00:00:00+00:00'
                        description: ISO 8601 timestamp of creation.
                      updated_at:
                        type: string
                        example: '2026-06-10T00:00:00+00:00'
                        description: ISO 8601 timestamp of last update.
      tags:
        - Customer Deposit Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_country:
                  type: string
                  description: >-
                    ISO 3166-1 alpha-2 country whose fiat this account receives.
                    Currently only US is supported; defaults to US.
                  example: US
                  enum:
                    - US
                destination:
                  type: object
                  description: ''
                  example: []
                  properties:
                    asset:
                      type: string
                      description: >-
                        The crypto asset received deposits are converted to.
                        Currently only USDC is supported; defaults to USDC.
                      example: USDC
                      enum:
                        - USDC
                    type:
                      type: string
                      description: Destination type.
                      example: external_address
                      enum:
                        - wallet
                        - external_address
                    wallet_uuid:
                      type: string
                      description: >-
                        The UUID of an existing wallet. Required when type is
                        wallet. This field is required when
                        <code>destination.type</code> is <code>wallet</code>.
                      example: wallet_1234567890
                    chain:
                      type: string
                      description: >-
                        Blockchain network. Required when type is
                        external_address. This field is required when
                        <code>destination.type</code> is
                        <code>external_address</code>.
                      example: ethereum
                      enum:
                        - ethereum
                        - polygon
                        - arbitrum
                        - avalanche
                        - optimism
                        - stellar
                        - solana
                        - base
                    address:
                      type: string
                      description: >-
                        The destination address (validated against the selected
                        chain). Required when type is external_address. This
                        field is required when <code>destination.type</code> is
                        <code>external_address</code>.
                      example: '0x1234567890abcdef1234567890abcdef12345678'
                    memo:
                      type: string
                      description: >-
                        Optional memo / destination tag (max 255). Must not be
                        greater than 255 characters.
                      example: null
                      nullable: true
                    transfer_purpose:
                      type: string
                      description: >-
                        The purpose of the transfer. `TRANSFER_TO_OWN_ACCOUNT`
                        means the beneficiary is the customer themself:
                        `is_self_transfer` is set to `true` automatically and
                        `beneficiary_info` must NOT be sent — it is composed
                        from the customer's verified KYC data only (insufficient
                        KYC data rejects the request).
                        `beneficiary_receiving_wallet_type` and
                        `beneficiary_institution_name` stay required.
                      example: SALARY
                      enum:
                        - TRANSFER_TO_OWN_ACCOUNT
                        - FAMILY_MAINTENANCE
                        - EDUCATION
                        - MEDICAL_TREATMENT
                        - HOTEL
                        - TRAVEL
                        - REPAYMENT_OF_LOANS
                        - TAX_PAYMENT
                        - PURCHASE_PROPERTY
                        - PROPERTY_RENTAL
                        - INSURANCE_PREMIUM
                        - PRODUCT_INDEMNITY_INSURANCE
                        - INSURANCE_CLAIMS
                        - MUTUAL_FUND_INVESTMENT
                        - INVESTMENT_SHARES
                        - DONATIONS
                        - SALARY
                        - INFO_SERVICE
                        - ADVERTISING
                        - ROYALTY_FEES
                        - BROKER_FEES
                        - ADVISOR_FEES
                        - REPRESENTATIVE_EXPENSES
                        - CONSTRUCTION
                        - TRANSPORTATION
                        - EXPORTED_GOODS
                        - DELIVERY_FEES
                        - GENERAL_GOODS_OFFLINE
                    is_self_transfer:
                      type: boolean
                      description: >-
                        Whether the deposit is a self-transfer. Optional (and
                        forced to `true`) when `transfer_purpose` is
                        `TRANSFER_TO_OWN_ACCOUNT`.
                      example: true
                    beneficiary_receiving_wallet_type:
                      type: string
                      description: >-
                        Beneficiary wallet type. Always required — it describes
                        the destination wallet, so it cannot be derived from
                        KYC.
                      example: non_custodial
                      enum:
                        - custodial
                        - non_custodial
                        - exchange
                        - other
                    beneficiary_institution_name:
                      type: string
                      description: >-
                        Beneficiary institution name (max 255). Always required
                        — it describes the destination wallet, so it cannot be
                        derived from KYC. Must not be greater than 255
                        characters.
                      example: Acme Inc.
                    beneficiary_info:
                      type: object
                      description: >-
                        Beneficiary identity details (US on-ramp requirement).
                        Must NOT be sent when `transfer_purpose` is
                        `TRANSFER_TO_OWN_ACCOUNT` — it is composed from the
                        customer's verified KYC data (individual or company
                        profile) and cannot be overridden.
                      example: []
                      properties:
                        beneficiary_name:
                          type: string
                          description: >-
                            Beneficiary full name (max 255). Must not be greater
                            than 255 characters.
                          example: John Doe
                        beneficiary_dob:
                          type: string
                          description: >-
                            Beneficiary date of birth (YYYY-MM-DD). Must be a
                            valid date in the format <code>Y-m-d</code>.
                          example: '1990-01-01'
                        beneficiary_id_doc_number:
                          type: string
                          description: >-
                            Beneficiary ID document number (max 255). Must not
                            be greater than 255 characters.
                          example: '12345678'
                        beneficiary_address:
                          type: object
                          description: Beneficiary residential address.
                          example: []
                          properties:
                            street:
                              type: string
                              description: Street. Must not be greater than 255 characters.
                              example: 123 4th Ave S
                            city:
                              type: string
                              description: City. Must not be greater than 255 characters.
                              example: Minneapolis
                            state_province:
                              type: string
                              description: >-
                                State or province. Required for countries that
                                have ISO 3166-2 subdivisions; optional
                                otherwise. Must not be greater than 255
                                characters.
                              example: MN
                              nullable: true
                            postal_code:
                              type: string
                              description: >-
                                Postal code. Must not be greater than 255
                                characters.
                              example: '55416'
                            country:
                              type: string
                              description: >-
                                The beneficiary's residential country (ISO
                                3166-1 alpha-2). Must be 2 characters.
                              example: US
                          required:
                            - street
                            - city
                            - postal_code
                            - country
                      required:
                        - beneficiary_name
                        - beneficiary_dob
                        - beneficiary_id_doc_number
                        - beneficiary_address
                  required:
                    - type
                    - transfer_purpose
                    - is_self_transfer
                    - beneficiary_receiving_wallet_type
                    - beneficiary_institution_name
                    - beneficiary_info
                application_reference_id:
                  type: string
                  description: >-
                    Your own reference identifier for this account (max 255).
                    Must not be greater than 255 characters.
                  example: ref-0001
                  nullable: true
                commission:
                  type: object
                  description: >-
                    Optional markup you charge your customer on each incoming
                    deposit. Deducted from the amount the customer receives.
                    Defaults to zero (customer receives the full converted
                    amount).
                  example: null
                  properties:
                    percentage:
                      type: number
                      description: >-
                        Percentage of the deposited amount to deduct as your
                        commission (0–100). Must be between 0 and 100.
                      example: 1.5
                      nullable: true
                    amount:
                      type: number
                      description: >-
                        Fixed amount (in the deposit currency) to deduct as your
                        commission per deposit. Must be at least 0.
                      example: 0.5
                      nullable: true
              required:
                - source_country
    parameters:
      - in: path
        name: customer_uuid
        description: The UUID of the customer.
        example: cus_1234567890
        required: true
        schema:
          type: string
