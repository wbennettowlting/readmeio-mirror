                    characters.
                  example: John
                middle_name:
                  type: string
                  description: >-
                    (type:individual) The middle name of the customer. Must not
                    be greater than 255 characters.
                  example: null
                  nullable: true
                last_name:
                  type: string
                  description: >-
                    (type:individual) The last name of the customer. This field
                    is required when <code>type</code> is
                    <code>individual</code>. Must not be greater than 255
                    characters.
                  example: Doe
                company_name:
                  type: string
                  description: >-
                    (type:business) The company name of the customer. This field
                    is required when <code>type</code> is <code>business</code>.
                    Must not be greater than 255 characters.
                  example: OwlPay Inc.
                email:
                  type: string
                  description: The email of the customer. Must be a valid email address.
                  example: harbor_customer@owlpay.com
                phone_country_code:
                  type: string
                  description: >-
                    The phone country code of the customer. Must be 2
                    characters.
                  example: US
                  nullable: true
                phone_number:
                  type: string
                  description: >-
                    The phone number of the customer. Must not be greater than
                    20 characters.
                  example: '4567891234'
                  nullable: true
                birth_date:
                  type: string
                  description: (KYC-delegated individual) Date of birth.
                  example: '1990-01-15'
                description:
                  type: string
                  description: >-
                    The description of the customer (Only application visible).
                    Must not be greater than 500 characters.
                  example: null
                  nullable: true
                intermediary_fi_reference:
                  type: string
                  description: >-
                    Optional. Name/reference of the downstream financial
                    institution (FI) that compiled and submitted this end user's
                    KYC/KYB data. For integrators using a B2B2X or multi-tier FI
                    architecture; other partners may omit it. Forwarded to the
                    compliance provider for FI-level risk tracking. Max 255
                    characters. Must not be greater than 255 characters.
                  example: Acme Trust Bank
                  nullable: true
                agreement_redirect_url:
                  type: string
                  description: >-
                    The URL to redirect after the customer signs the agreement.
                    Must be a valid URL.
                  example: https://example.com/redirect
                  nullable: true
                incorporation_date:
                  type: string
                  description: >-
                    (KYC-delegated business) Company incorporation /
                    establishment date.
                  example: '2015-06-20'
                country:
                  type: string
                  description: >-
                    (KYC-delegated only) ISO 3166-1 alpha-2 country code. For
                    `type:individual` represents nationality; for
                    `type:business` represents registered / incorporation
                    country.
                  example: TW
                identification_number:
                  type: string
                  description: >-
                    (KYC-delegated only) For `type:individual` the personal ID /
                    passport number; for `type:business` the company
                    registration / tax ID number.
                  example: A123456789
                address:
                  type: object
                  description: >-
                    (KYC-delegated only) Residential (individual) or business
                    address object.
                  example: []
                  properties:
                    city:
                      type: string
                      description: (KYC-delegated only) City.
                      example: Taipei
                    street:
                      type: string
                      description: (KYC-delegated only) Street line.
                      example: Fuxing N. Rd.
                    country:
                      type: string
                      description: >-
                        (KYC-delegated only) ISO 3166-1 alpha-2 country code of
                        the address.
                      example: TW
                    postal_code:
                      type: string
                      description: (KYC-delegated only) Postal / ZIP code.
                      example: '10491'
                    state_province:
                      type: string
                      description: >-
                        (KYC-delegated only) State or province. Optional when
                        the address.country has no ISO 3166-2 subdivisions (e.g.
                        HKG, VAT).
                      example: Taipei
              required:
                - type
                - email
