          description: answered
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    type: general
                    status: answered
                    level: null
                    expire_date: null
                    description: We need more information about your account activity.
                    questions:
                      - key: '1'
                        label: What is the purpose of this account?
                        type: short_answer
                        required: true
                        options: null
                        limit:
                          required: true
                    answers:
                      '1': Personal savings
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: general
                        description: RFI source. Always `general` on this endpoint.
                      status:
                        type: string
                        example: answered
                        description: '`pending`, `answered`, or `requires_manual_review`.'
