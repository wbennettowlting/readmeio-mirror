          description: Invalid country code
          content:
            application/json:
              schema:
                type: object
                example:
                  message: The country must be a valid ISO 3166-1 alpha-2 code.
                  error: The country must be a valid ISO 3166-1 alpha-2 code.
                  code: 2005
                  error_type: general.validation_error
                  errors:
