openapi: 3.0.3
info:
  title: OwlPay Harbor API
  description: OwlPay Harbor API Documentation
  version: 1.0.0
servers:
  - url: https://harbor-sandbox.owlpay.com
tags:
  - name: (Deprecated) Transfer (v1)
    description: >-
      APIs for managing transfers. **Deprecated:** This API will be removed
      after 2026-04-01. Please migrate to Transfer (v2).
  - name: Application
    description: APIs for retrieving application information.
  - name: Application Recipients
    description: >-
      APIs for managing application-level recipients (shared recipient book for
      transfer destinations).
  - name: Bank Connection
    description: APIs for connecting and managing bank accounts.
  - name: Countries
    description: Reference data for countries and their subdivisions.
  - name: Customer's Cards
    description: APIs for managing customer's linked cards.
  - name: Customer Deposit Accounts
    description: >-
      APIs for managing customer deposit accounts — virtual bank accounts that
      auto-convert incoming fiat deposits into crypto sent to a configured
      destination. Requires the application to have the customer deposit account
      feature enabled.
  - name: Customer Management
    description: APIs for managing customers.
  - name: Customer Onboarding
    description: >-
      Submit full KYB data for a business customer in one call; Harbor
      orchestrates verification asynchronously.
  - name: Endpoints
    description: ''
  - name: Faucet
    description: >-
      APIs for claiming testnet USDC or USDT to a specified blockchain address.
      Only available in non-production environments. `POST /faucet` is the
      current endpoint — it supports choosing the currency (新版支援自選幣別 USDC/USDT);
      `POST /faucet/usdc` is the earlier Circle Sandbox endpoint, USDC only,
      kept for existing callers.
  - name: Individual Graded KYC (v2)
    description: >-
      Graded verification for individual customers: submit KYC data for a level,
      correct and resend, read the standing, and apply for a higher level. Every
      endpoint answers one shape -- the customer's verification standing.
  - name: RFI (Request for Information) (v1)
    description: >-
      Read an open RFI and submit its answers, for both general AML RFIs
      (customer-scoped) and CPN off-ramp RFIs (transfer-scoped). Both surfaces
      answer the same unified schema. The transfer-scoped pair
      (`showForTransfer` / `answerForTransfer`) is also registered on the V2
      transfer surface — see the (v2) group, which is this same class with no
      logic override, only a doc-only subclass for a distinct group.
  - name: RFI (Request for Information) (v2)
    description: >-
      Read an open RFI and submit its answers for a CPN off-ramp RFI
      (transfer-scoped), on the V2 transfer surface. Identical behavior to the
      V1 RFI group's transfer-scoped endpoints — this class adds no logic of its
      own, only a distinct doc group.
  - name: Reconciliation
    description: APIs for reconciliation.
  - name: Transfer (v2)
    description: APIs for managing transfers.
  - name: Wallet
    description: APIs for managing application wallets (blockchain addresses).
  - name: Webhook subscriptions
    description: APIs for managing webhook subscriptions.
components:
  securitySchemes:
    default:
      type: apiKey
      name: X-API-KEY
      in: header
      description: >-
        Please contact your customer service team to obtain your <b> API Key
        </b>.
security:
  - default: []
