    post:
      summary: Create an application recipient
      operationId: createAnApplicationRecipient
      description: >-
        The request body has only two fields — `name` and `payload` — but
        `payload` is where all the

        recipient details go, and it is a free-form map, so it cannot be listed
        as a fixed set of

        fields here.


        **What goes into `payload`:** the `destination.*` fields of the transfer
        create body, written

        as flat dot-notation keys. The accepted keys differ per payout method
        and provider, so the

        authoritative list for a given route is the quote requirements endpoint

        (`GET /api/v2/transfers/quotes/{quote_uuid}/requirements`) — every
        `destination.*`

        path in that schema is a valid `payload` key.


        Two rules to be aware of:


        1. Keys must be the literal flat strings shown below. A nested object
           (`{"destination": {"payout_instrument": {...}}}`) is **not** accepted.
        2. Keys that do not start with `destination.` are stored but ignored
        when the recipient is
           applied to a transfer.

        Example payload for a wire payout:


        ```json

        {
          "destination.beneficiary_info.beneficiary_name": "John Smith",
          "destination.beneficiary_info.beneficiary_address.street": "1 Market St",
          "destination.beneficiary_info.beneficiary_address.city": "San Francisco",
          "destination.beneficiary_info.beneficiary_address.country": "US",
          "destination.payout_instrument.account_holder_name": "John Smith",
          "destination.payout_instrument.bank_name": "HSBC Bank USA",
          "destination.payout_instrument.account_number": "1234567890",
          "destination.payout_instrument.swift_code": "HSBCUSHH",
          "destination.transfer_purpose": "SALARY",
          "destination.is_self_transfer": false
        }

        ```


        The stored recipient is then applied to a transfer by passing its `uuid`
        as `recipient_id` on

        transfer creation; explicit `destination.*` fields in the transfer
        request override the

        recipient's values.
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    object: recipient
                    uuid: rcpt_0123456789abcdefghij0123456789abcdefghij
                    name: Shared Wire
                    payload:
                      destination.beneficiary_info.beneficiary_name: John Smith
                      destination.payout_instrument.account_holder_name: John Smith
                      destination.payout_instrument.account_number: '1234567890'
                      destination.payout_instrument.bank_name: HSBC Bank USA
                      destination.payout_instrument.swift_code: HSBCUSHH
                      destination.transfer_purpose: SALARY
                      destination.is_self_transfer: false
                    created_at: '2026-06-10T00:00:00+00:00'
                    updated_at: '2026-06-10T00:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        example: recipient
                        description: The object type. Always `recipient`.
                      uuid:
                        type: string
                        example: rcpt_0123456789abcdefghij0123456789abcdefghij
                        description: >-
                          The unique identifier of the recipient. Use this to
                          reference the recipient in subsequent show / update /
                          delete calls.
                      name:
                        type: string
                        example: Shared Wire
                        description: The user-friendly name of the recipient.
                      payload:
                        type: object
                        properties:
                          destination.beneficiary_info.beneficiary_name:
                            type: string
                            example: John Smith
                          destination.payout_instrument.account_holder_name:
                            type: string
                            example: John Smith
                          destination.payout_instrument.account_number:
                            type: string
                            example: '1234567890'
                          destination.payout_instrument.bank_name:
                            type: string
                            example: HSBC Bank USA
                          destination.payout_instrument.swift_code:
                            type: string
                            example: HSBCUSHH
                          destination.transfer_purpose:
                            type: string
                            example: SALARY
                          destination.is_self_transfer:
                            type: boolean
                            example: false
                        description: >-
                          A flat map of dot-notation `destination.*` field paths
                          to their stored values. The available paths are the
                          destination fields of the payout method — retrieve
                          them from the quote requirements endpoint.
                      created_at:
                        type: string
                        example: '2026-06-10T00:00:00+00:00'
                        description: ISO 8601 timestamp of when the recipient was created.
                      updated_at:
                        type: string
                        example: '2026-06-10T00:00:00+00:00'
                        description: >-
                          ISO 8601 timestamp of when the recipient was last
                          updated.
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                example:
                  message: The name field is required.
                  error: The name field is required.
                  code: 2005
                  error_type: general.validation_error
                  errors:
                    name:
                      - The name field is required.
                properties:
                  message:
                    type: string
                    example: The name field is required.
                  error:
                    type: string
                    example: The name field is required.
                  code:
                    type: integer
                    example: 2005
                  error_type:
                    type: string
                    example: general.validation_error
                  errors:
                    type: object
                    properties:
                      name:
                        type: array
                        example:
                          - The name field is required.
                        items:
                          type: string
      tags:
        - Application Recipients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: >-
                    A user-friendly name for this recipient entry. Must not be
                    greater than 255 characters.
                  example: Mom's bank account
                payload:
                  type: object
                  description: >-
                    The full recipient details, as a flat map of dot-notation
                    `destination.*` field paths to their pre-filled values. This
                    is where bank details go — account number, bank name,
                    SWIFT/BIC, IBAN, local rails identifiers, and so on. The
                    accepted paths are exactly the `destination.*` fields of the
                    transfer create body for the payout method in question;
                    retrieve the list for a given payout method from the quote
                    requirements endpoint. Pass this recipient to a transfer by
                    sending its `uuid` as `recipient_id`.
                  example:
                    destination.beneficiary_info.beneficiary_name: John Smith
                    destination.payout_instrument.account_holder_name: John Smith
                    destination.payout_instrument.account_number: '1234567890'
                    destination.payout_instrument.bank_name: HSBC Bank USA
                    destination.payout_instrument.swift_code: HSBCUSHH
                    destination.transfer_purpose: SALARY
                    destination.is_self_transfer: false
                  properties: {}
              required:
                - name
                - payload
