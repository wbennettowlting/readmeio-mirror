                properties:
                  message:
                    type: string
                    example: No open RFI for this customer.
                  error:
                    type: string
                    example: No open RFI for this customer.
                  code:
                    type: integer
                    example: 2001
                  error_type:
                    type: string
                    example: general.resource_not_found
        '409':
          description: requires manual review
          content:
            application/json:
              schema:
                type: object
                example:
                  message: >-
                    This RFI requires manual review and cannot be answered via
                    the API.
