        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settlement_strategy:
                  type: string
                  description: >-
                    Defines when the received funds should be settled to the
                    destination. (default: immediate).
                  example: immediate
                  enum:
                    - immediate
                    - scheduled
                  nullable: true
                destination:
                  type: object
                  description: ''
                  example: []
                  properties:
                    customer_crypto_address_id:
                      type: string
                      description: >-
                        (on-ramp) The customer crypto address ID (if you want to
                        use a specific customer crypto address, you can provide
                        the id here (If you input both, destination.address will
                        be ignored)). This field is required when
                        <code>destination.address</code> is not present.
                      example: '{{YOUR_CUSTOMER_CRYPTO_ADDRESS_ID}}'
                    address:
                      type: string
                      description: >-
                        (on-ramp) The address of the destination. This field is
                        required when
                        <code>destination.customer_crypto_address_id</code> is
                        not present.
                      example: '0x4B20993Bc481177ec7E8f571ceCaE8A9e22C02db'
                    address_memo:
                      type: string
                      description: >-
                        (on-ramp)(optional) Some blockchain supports memo for
                        the address.
                      example: '1234567890'
                      nullable: true
                    chain:
                      type: string
                      description: >-
                        (on-ramp) The chain of the destination. This field is
                        required when <code>destination.address</code> is
                        <code>!null</code>.
                      example: ethereum
                      enum:
                        - ethereum
                        - polygon
                        - arbitrum
                        - avalanche
                        - optimism
                        - stellar
                        - solana
                        - base
                    beneficiary_name:
                      type: string
                      description: >-
                        (on-ramp) The beneficiary name of the destination. This
                        field is required when <code>destination.address</code>
                        is <code>!null</code>.
                      example: John
                    asset:
                      type: string
                      description: The asset of the destination.
                      example: USDC
                    amount:
                      type: number
                      description: >-
                        The amount of the destination. This field is required
                        when none of <code>source.amount</code> are present.
                        Must be at least 0.
                      example: 100
                    is_self_transfer:
                      type: boolean
                      description: Whether the transfer is self-transfer or not.
                      example: true
                    transfer_purpose:
                      type: string
                      description: >-
                        The transfer purpose of the destination, this column is
                        required when is_self_transfer is *false*. This field is
                        required when <code>destination.is_self_transfer</code>
                        is <code>false</code>.
                      example: Salary
                    supporting_document:
                      type: string
                      description: >-
                        Supporting document for the destination, providing
                        supporting documents can effectively reduce the chances
                        of being issued an RFI (Request For Information).
                        Supported formats: png, jpg, jpeg, pdf, csv, docx, xlsx.
                      example: data:image/png;base64,iVBORw0KGgoAAAANSUh...
                      nullable: true
                    beneficiary_type:
                      type: string
                      description: >-
                        (on-ramp) The beneficiary is a company or an individual,
                        (allowed values: individual, company).
                      example: individual
                      enum:
                        - company
                        - individual
                    beneficiary_dob:
                      type: string
                      description: >-
                        (on-ramp) When the transfer is on-ramp and the transfer
                        amount exceeds 3,000 USD, Harbor requires you to enter
                        the beneficiary information. Must be a valid date in the
                        format <code>Y-m-d</code>.
                      example: '2026-09-09'
                      nullable: true
                    residential_country_code:
                      type: string
                      description: >-
                        (on-ramp) ISO 3166-1 alpha-2 code of the beneficiary’s
                        residential countr. Must be 2 characters.
                      example: US
                    residential_state:
                      type: string
                      description: >-
                        (on-ramp) State/Province/Region of the beneficiary’s
                        residence.
                      example: CA
                      enum:
                        - not applicable
                        - AL
                        - AZ
                        - AR
                        - DE
                        - DC
                        - FL
                        - GA
                        - ID
                        - IL
                        - IA
                        - ME
                        - MD
                        - MI
                        - MN
                        - MS
                        - MO
                        - MT
                        - NE
                        - NH
                        - ND
                        - OK
                        - OR
                        - SC
                        - SD
                        - TN
                        - UT
                        - VT
                        - VA
                        - WV
                        - WY
                        - AK
                        - KY
                        - CO
                        - WI
                        - PA
                        - NC
                        - KS
                        - WA
                        - NM
                    residential_city:
                      type: string
                      description: (on-ramp) City of the beneficiary’s residence.
                      example: San Francisco
                      nullable: true
                    residential_postal_code:
                      type: string
                      description: >-
                        (on-ramp) Postal/ZIP code of the beneficiary’s
                        residence.
                      example: '94103'
                    residential_address_1:
                      type: string
                      description: (on-ramp) Primary street address of the beneficiary.
                      example: 123 Market St
                    residential_address_2:
                      type: string
                      description: >-
                        (on-ramp) Secondary address details (e.g., apartment,
                        suite, unit).
                      example: Apt 4B
                      nullable: true
                    beneficiary_id_doc_type:
                      type: string
                      description: >-
                        (on-ramp) The type of identification document for the
                        beneficiary. allowed values for individual: ID_CARD,
                        PASSPORT, DRIVERS, PAYMENT_SOURCE, BANK_CARD, OTHER,
                        allowed values for company: COMPANY_DOC,
                        TRANSPARENCY_REGISTRY_EXTRACT, POWER_OF_ATTORNEY.
                      example: BANK_CARD
                      enum:
                        - ID_CARD
                        - PASSPORT
                        - DRIVERS
                        - PAYMENT_SOURCE
                        - BANK_CARD
                        - OTHER
                      nullable: true
                    beneficiary_id_doc_country_code:
                      type: string
                      description: >-
                        (on-ramp) The country of issuance for the identification
                        document. Must be 2 characters.
                      example: vt
                      nullable: true
                    beneficiary_id_doc_number:
                      type: string
                      description: (on-ramp) The number of the identification document.
                      example: id
                      nullable: true
                    beneficiary_receiving_wallet_type:
                      type: string
                      description: >-
                        (on-ramp) The type of wallet the beneficiary will
                        receive funds into. (allowed values: personalWallet,
                        thirdPartyCustodian, other).
                      example: id
                    beneficiary_institution_name:
                      type: string
                      description: >-
                        (on-ramp) Name of the wallet provider or institution
                        (e.g., `MetaMask`).
                      example: aut
                  required:
                    - is_self_transfer
                source:
                  type: object
                  description: ''
                  example: []
                  properties:
                    method:
                      type: string
                      description: >-
                        (on-ramp) The method of the source (allow: ach, wire,
