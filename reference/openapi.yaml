                  example: '{{YOUR_CUSTOMER_UUID}}'
                commission:
                  type: object
                  description: ''
                  example: []
                  properties:
                    percentage:
                      type: number
                      description: >-
                        The percentage of the commission. Must be between 0 and
                        100.00.
                      example: 0.01
                      nullable: true
                    amount:
                      type: number
                      description: The amount of the commission. Must be at least 0.
                      example: 1
                      nullable: true
                application_transfer_uuid:
                  type: string
                  description: The application transfer UUID.
                  example: '{{YOUR_APPLICATION_TRANSFER_UUID}}'
                meta_data:
                  type: object
                  description: >-
                    (optional) Arbitrary key-value metadata to attach to the
                    transfer. Echoed back on the transfer object and in
                    webhooks.
                  example:
                    order_id: '12345'
                  properties: {}
                  nullable: true
              required:
                - on_behalf_of
                - application_transfer_uuid
