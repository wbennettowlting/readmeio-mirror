    get:
      summary: Get the Owlting KYC Apply Page
      operationId: getTheOwltingKYCApplyPage
      description: ''
      parameters:
        - in: header
          name: X-API-KEY
          description: ''
          example: '{YOUR_API_KEY}'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: >-
                  <html>


                  <head>
                      <title>WebSDK CDN Example</title>
                  </head>


                  <body>
                      <script src="https://static.sumsub.com/idensic/static/sns-websdk-builder.js"></script>
                      <div id="sumsub-websdk-container"></div>
                  </body>


                  </html>


                  <script>
                      function launchWebSdk(accessToken, applicantEmail, applicantPhone) {
                      let snsWebSdkInstance = snsWebSdk
                          .init(accessToken, () => this.getNewAccessToken())
                          .withConf({
                              lang: "en",
                              email: applicantEmail,
                              phone: applicantPhone,
                          })
