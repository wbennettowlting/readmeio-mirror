        - Transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  type: object
                  description: ''
                  example: []
                  nullable: false
                  properties:
                    customer_crypto_address_id:
                      type: string
                      description: >-
                        (on-ramp) The customer crypto address ID (if you want to
                        use a specific customer crypto address, you can provide
                        the id here (If you input both, destination.address will
                        be ignored)). This field is required when
                        <code>destination.address</code> is not present.
                      example: '{{YOUR_CUSTOMER_CRYPTO_ADDRESS_ID}}'
                      nullable: false
                    address:
                      type: string
                      description: >-
                        (on-ramp) The address of the destination. This field is
                        required when
                        <code>destination.customer_crypto_address_id</code> is
                        not present.
                      example: '0x4B20993Bc481177ec7E8f571ceCaE8A9e22C02db'
                      nullable: false
                    address_memo:
                      type: string
                      description: >-
                        (on-ramp)(optional) Some blockchain supports memo for
                        the address.
                      example: '1234567890'
                      nullable: true
                    chain:
                      type: string
                      description: >-
                        (on-ramp) The chain of the destination. This field is
                        required when <code>destination.address</code> is
                        <code>!null</code>.
                      example: ethereum
                      nullable: false
                      enum:
                        - ethereum
                        - arbitrum
                        - polygon
                        - avalanche
                        - optimism
                        - stellar
                    beneficiary_name:
                      type: string
                      description: >-
                        (on-ramp) The beneficiary name of the destination. This
                        field is required when <code>destination.address</code>
                        is <code>!null</code>.
                      example: John
                      nullable: false
                    asset:
                      type: string
                      description: The asset of the destination.
                      example: USDC
                      nullable: false
                  required:
                    - asset
                source:
                  type: object
                  description: ''
                  example: []
                  nullable: false
                  properties:
                    on_behalf_of:
                      type: string
                      description: >-
                        When you transfer to a third party (not the customer
                        himself) on behalf of your customer, this field is
                        required. This field is required when
                        <code>destination.address</code> is <code>!null</code>.
                      example: '{{YOUR_CUSTOMER_UUID}}'
                      nullable: false
                    asset:
                      type: string
                      description: The asset of the source.
                      example: USD
                      nullable: false
                    amount:
                      type: number
                      description: The amount of the source. Must be at least 0.
                      example: 100
                      nullable: false
                  required:
                    - asset
                    - amount
                commission:
                  type: object
                  description: ''
                  example: []
                  nullable: false
                  properties:
                    percentage:
                      type: number
                      description: >-
                        The percentage of the commission. Must be between 0.01
                        and 100.00.
                      example: 0.01
                      nullable: true
                    amount:
                      type: number
                      description: The amount of the commission. Must be at least 0.
                      example: 1
                      nullable: true
                application_transfer_uuid:
                  type: string
                  description: The application transfer UUID.
                  example: '{{YOUR_APPLICATION_TRANSFER_UUID}}'
                  nullable: false
              required:
                - application_transfer_uuid
